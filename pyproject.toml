[project]
name = "axiom"
version = "0.1.0"
description = "Deterministic multi-agent workflow orchestration — the control layer, not the execution layer."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
keywords = ["agent-orchestration", "workflow", "llm", "automation", "control-layer"]

[project.urls]
Homepage = "https://github.com/axiom-orch/axiom"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires a live agent runtime backend (skipped by default)"]
addopts = "-m 'not integration'"
